# Production stack. Run with:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Only nginx publishes ports. Postgres and Qdrant are reachable only on the internal
# network. File storage is a managed S3 bucket (set the S3_* variables in .env.prod)
# rather than a self-hosted MinIO, so browsers fetch presigned URLs straight from S3.
name: rag

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy_params:/etc/nginx/proxy_params:ro
      # Per-file, not a directory mount: certbot's live/<domain>/*.pem are
      # symlinks into ../../archive/<domain>/ -- mounting the live/ directory
      # whole would carry the symlinks in unresolved (dangling inside the
      # container, since only that one directory is mounted). Bind-mounting
      # each file individually resolves the symlink on the host at mount
      # time instead, so the container just sees the real file -- no need to
      # also mount /etc/letsencrypt/archive. Confirmed for docker-compose.dev.yml;
      # applied here too since this file has the identical real-certbot scenario.
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR to a folder with fullchain.pem and privkey.pem}/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_CERT_DIR}/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://rag.example.com}
        NEXT_PUBLIC_STORAGE_ORIGIN: ${STORAGE_PUBLIC_URL:?set STORAGE_PUBLIC_URL, e.g. https://my-bucket.s3.us-east-1.amazonaws.com}
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      ENVIRONMENT: prod
      TRUSTED_PROXY_HOPS: "1"
    volumes:
      - ${RAG_DATA_DIR:-rag-data}:/app/.rag-data
      - ./models:/models:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: rag_engine
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (and use the same value in POSTGRES_DSN)}
    volumes:
      - ${PGDATA_DIR:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_engine"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY (and the same value in .env.prod)}
    volumes:
      - ${QDRANT_DATA_DIR:-qdrant-data}:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    restart: unless-stopped

  # ---- enterprise ingest worker: same image as the API, different command ----
  # Scans sources, parses, embeds and indexes documents. Jobs are claimed with SKIP LOCKED, so any number of
  # workers can run side by side:  docker compose ... up -d --scale worker=4
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DOCPARSE: ${INSTALL_DOCPARSE:-1}
        INSTALL_LEGACY_OFFICE: ${INSTALL_LEGACY_OFFICE:-1}
        INSTALL_CONNECTORS: ${INSTALL_CONNECTORS:-1}
    command: ["python", "-m", "app.scale.worker"]
    healthcheck:
      # The worker has no port. It touches a file every 20 s while its loop runs; no touch for 2 min = stuck or dead.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/scale-worker.alive') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    stop_grace_period: 60s
    env_file: .env.prod
    environment:
      ENVIRONMENT: prod
    volumes:
      - ${RAG_DATA_DIR:-rag-data}:/app/.rag-data
      - ./models:/models:ro
      - ${SCALE_SOURCE_DIR:-./sources}:/mnt/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # ---- optional model servers (profile "models"): scripts/<stack>/start.sh --models ----
  # Hugging Face text-embeddings-inference. CPU image by default; on a GPU host set TEI_IMAGE to a GPU tag and add
  # the nvidia device reservation. Models download on first start into the hf-cache volume.
  embed:
    profiles: ["models"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    command: ["--model-id", "${EMBED_MODEL_ID:-BAAI/bge-m3}", "--max-client-batch-size", "128"]
    volumes:
      - hf-cache:/data
    restart: unless-stopped

  rerank:
    profiles: ["models"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    command: ["--model-id", "${RERANK_MODEL_ID:-BAAI/bge-reranker-v2-m3}"]
    volumes:
      - hf-cache:/data
    restart: unless-stopped


volumes:
  pgdata:
  qdrant-data:
  rag-data:
  hf-cache:
