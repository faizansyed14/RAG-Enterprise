# Round-robin in front of the three Qdrant nodes. Any node can answer any request (it routes to the shards' owners itself), and a
# node that stops answering is skipped. The API key header is passed through untouched; Qdrant checks it.
events {}
http {
  upstream qdrant_http { server qdrant:6333 max_fails=2 fail_timeout=10s; server qdrant2:6333 max_fails=2 fail_timeout=10s; server qdrant3:6333 max_fails=2 fail_timeout=10s; }
  server {
    listen 6333;
    client_max_body_size 64m;
    location / {
      proxy_pass http://qdrant_http;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_read_timeout 120s;
    }
  }
}
