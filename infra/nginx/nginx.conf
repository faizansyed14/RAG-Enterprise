# Reverse proxy for the production stack. Terminates TLS and is the ONLY service that
# publishes ports. Set TRUSTED_PROXY_HOPS=1 on the backend so it reads the client IP that
# this proxy appends to X-Forwarded-For (never trust that header without a proxy in front).

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 55m;            # backend enforces MAX_UPLOAD_MB (50) itself

  # Per-address limits, in front of the app's own Postgres-backed limits.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Mount your certificate and key here (e.g. from certbot) -- see docker-compose.prod.yml.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://backend:8000;
      include /etc/nginx/proxy_params;
    }

    # Server-sent events: no buffering, long timeouts.
    location ~ ^/api/(chat|documents/[^/]+/progress)$ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend:8000;
      include /etc/nginx/proxy_params;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      chunked_transfer_encoding on;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend:8000;
      include /etc/nginx/proxy_params;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://frontend:3000;
      include /etc/nginx/proxy_params;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
